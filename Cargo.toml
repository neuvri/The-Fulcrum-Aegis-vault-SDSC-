[package]
name = "aegis-vault"
version = "9.2.0"
edition = "2021"

[[bin]]
name = "aegis-vault"
path = "src/main.rs"

[[bin]]
name = "aegis-cli"
path = "src/cli.rs"

[features]
default = []

[dependencies]
aes-gcm     = { version = "0.10", features = ["stream", "alloc"] }
aes-gcm-siv = "0.11"
argon2      = "0.5"
hkdf        = "0.12"
hmac        = "0.12"
sha2        = "0.10"
subtle      = "2.5"
rand        = { version = "0.8", features = ["getrandom", "std_rng"] }

zeroize = { version = "1.7", features = ["derive", "alloc"] }
secrecy = "0.8"

tokio      = { version = "1",   features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

fs4 = { version = "0.8", features = ["tokio"] }

sharks  = "0.5"
qrcode  = "0.14"

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex        = "0.4"

tracing            = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell          = "1.19"
chrono             = { version = "0.4", features = ["clock"] }

rpassword = "7.3"
clap      = { version = "4.5", features = ["derive"] }

axum       = "0.7"
tower      = { version = "0.4", features = ["util"] }

# Outbound HTTP client for portal audit sync (rustls-based, no OpenSSL dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# TLS — direct hyper/rustls stack (compatible with axum 0.7)
hyper          = { version = "1",    features = ["http1", "server"] }
hyper-util     = { version = "0.1",  features = ["tokio", "server", "server-auto"] }
tokio-rustls   = "0.26"
rustls         = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen          = "0.13"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"

[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 16
strip           = true
panic           = "abort"
debug           = false
overflow-checks = true
